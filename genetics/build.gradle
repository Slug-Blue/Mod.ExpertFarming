// :genetics: pure-Java genetics engine (ADR-0001, docs/05-architecture.md §3).
// No dependencies at all: no Minecraft, no Forge, no libraries. Only JUnit 5
// for tests. A class that imports net.minecraft.* does not compile here.
plugins {
    id 'java-library'
}

// Java 17 toolchain (docs/05-architecture.md §18). Locally foojay downloads
// the JDK if none is installed; CI installs Temurin 17 via actions/setup-java
// and disables auto-download (SEC-40).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = mod_group_id
version = mod_version

// SEC-37: Maven Central only, limited to the test libraries.
repositories {
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroupByRegex 'org\\.junit(\\..*)?'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// SEC-42: reproducible archives (no file timestamps, fixed entry order), so
// two builds of the same commit give the same sha256.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
