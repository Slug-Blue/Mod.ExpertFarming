# Wild Roots (wildroots): build properties.
# Every version below is exact (no '+', ranges, latest.* or -SNAPSHOT; SEC-38).
# Sources of each number: docs/05-architecture.md §18.

# Memory for the Minecraft decompilation step (from Forge MDK 1.20.1).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Minecraft and Forge
minecraft_version=1.20.1
# Forge MDK 1.20.1 promotions: recommended = latest = 47.4.28
forge_version=47.4.28

## Build plugins
# ForgeGradle: MDK 47.4.28 asks for [6.0,6.2); newest 6.0.x on maven.minecraftforge.net
forgegradle_version=6.0.54
foojay_resolver_version=1.0.0
parchment_librarian_version=1.2.0
# Parchment mappings channel 'parchment', version <date>-<minecraft_version>
parchment_mappings_version=2023.09.03
mixingradle_version=0.7.38
# Mixin annotation processor; must match the Mixin bundled with Forge 47.x
mixin_version=0.8.5

## Tests only
junit_version=5.14.4
archunit_version=1.5.1

## Mod metadata
mod_id=wildroots
mod_name=Wild Roots
mod_license=All Rights Reserved
mod_version=1.20.1-0.0.0
mod_group_id=io.github.slugblue.wildroots
mod_authors=Slug-Blue
