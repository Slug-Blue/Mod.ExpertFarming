# WR-010: build, JUnit (:genetics, :mod, ArchUnit) and GameTest on every PR
# and on push to main (docs/05-architecture.md §17, ADR-0016).
# SEC-41: every action is pinned by full commit SHA (tag in the comment),
# the token is read-only, and the PR event is pull_request (no secrets).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SEC-37: only official repositories, https, no mavenLocal/JitPack/flatDir
      - name: Check Gradle repositories
        run: bash ci/check-repositories.sh

      # SEC-41: actions pinned by SHA, no pull_request_target, manual release
      - name: Check workflows
        run: bash ci/check-workflows.sh

      # SEC-38, SEC-43, SEC-45: forbidden constructs, exact versions,
      # mixin and access transformer allowlists, no @Overwrite
      - name: Check sources and allowlists
        run: bash ci/check-sources.sh

      # the jar self-test needs the JDK 'jar' tool
      - name: Set up Temurin 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # every check must reject its negative fixture
      - name: Self-test of the checks
        run: bash ci/selftest.sh

  # WR-015 / SEC-41: secret scan of the whole history on every run.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .'

  build:
    name: Build, tests, GameTest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SEC-39: gradle-wrapper.jar must be an official Gradle wrapper
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # SEC-40: JDK 17 comes from setup-java; toolchain auto-download is off
      - name: Set up Temurin 17 with Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build, JUnit and GameTest
        run: >-
          ./gradlew --no-daemon --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          :genetics:test :mod:test :mod:runGameTestServer build

      # SEC-42: jar content allowlist, no nested jars or native libraries
      - name: Check jar content
        run: bash ci/check-jar.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            genetics/build/reports/tests/
            mod/build/reports/tests/
            mod/run/logs/
          retention-days: 7

  # WR-014 / SEC-44: behavioural proof of "zero outgoing connections".
  # Phase 4: a scaffold, not yet a required check; required green from
  # phase 7 (WR-605).
  gametest-offline:
    name: GameTest without network
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 17 with Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # online: fill the Gradle and ForgeGradle caches, compile everything
      - name: Warm up caches
        run: >-
          ./gradlew --no-daemon --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          build :mod:prepareRunGameTestServer

      - name: Disable the Forge version check (versionCheck = false)
        run: bash ci/offline-gametest.sh prepare

      # a fresh network namespace has only a loopback interface: any
      # outgoing connection fails
      - name: Run GameTest without network
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            if curl -sS --max-time 5 https://services.gradle.org/ >/dev/null 2>&1; then
              echo "the network namespace still has network access" >&2
              exit 1
            fi
            exec sudo -u "$1" env HOME="$2" JAVA_HOME="$3" PATH="$3/bin:/usr/local/bin:/usr/bin:/bin" \
              ./gradlew --offline --no-daemon --stacktrace \
              -Porg.gradle.java.installations.auto-download=false :mod:runGameTestServer
          ' _ "$USER" "$HOME" "$JAVA_HOME"

      # a caught connection attempt does not fail a GameTest by itself
      - name: Scan the server log for network attempts
        run: bash ci/offline-gametest.sh scan

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gametest-offline-logs
          path: mod/run/logs/
          retention-days: 7
