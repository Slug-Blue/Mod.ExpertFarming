# WR-015 / SEC-41: weekly dependency update PRs.
# A Gradle bump also needs gradle/verification-metadata.xml regenerated and
# reviewed (CONTRIBUTING.md §7) and, for a new dependency, an ADR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # ForgeGradle 6 (Minecraft 1.20.1) runs only on Gradle 8.x; Forge 47.x and
    # Parchment are pinned to Minecraft 1.20.1. Majors are bumped by hand.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]
      - dependency-name: net.minecraftforge.gradle*
        update-types: ["version-update:semver-major"]
      - dependency-name: net.minecraftforge:forge
      - dependency-name: org.parchmentmc*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
