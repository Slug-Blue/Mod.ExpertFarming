# WR-015 / SEC-41: weekly dependency update PRs.
# A Gradle bump also needs gradle/verification-metadata.xml regenerated and
# reviewed (CONTRIBUTING.md §7) and, for a new dependency, an ADR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
