// Wild Roots (wildroots): two subprojects, see docs/05-architecture.md §3 and ADR-0001.
// Plugin versions are exact and live in gradle.properties (SEC-38).

pluginManagement {
    repositories {
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        gradlePluginPortal()
    }
    plugins {
        id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version "${foojay_resolver_version}"
}

rootProject.name = 'wildroots'

include ':genetics', ':mod'
