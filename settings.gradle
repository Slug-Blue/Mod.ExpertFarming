// Wild Roots (wildroots): two subprojects, see docs/05-architecture.md §3 and ADR-0001.
// Plugin versions are exact and live in gradle.properties (SEC-38).

pluginManagement {
    // Repositories (docs/05-architecture.md §18, SEC-37): official hosts only,
    // https only, each one limited to its own groups with exclusiveContent.
    // Checked by ci/check-repositories.sh.
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'MinecraftForge'
                    url = 'https://maven.minecraftforge.net/'
                }
            }
            filter {
                includeGroupByRegex 'net\\.minecraftforge(\\..*)?'
                includeGroup 'de.oceanlabs.mcp'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                }
            }
            filter {
                includeGroupByRegex 'org\\.parchmentmc(\\..*)?'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'SpongePowered'
                    url = 'https://repo.spongepowered.org/repository/maven-public/'
                }
            }
            filter {
                includeGroupByRegex 'org\\.spongepowered(\\..*)?'
            }
        }
        exclusiveContent {
            forRepository {
                gradlePluginPortal()
            }
            filter {
                // plugin markers and artifacts that live only on the Plugin Portal
                includeGroupByRegex 'org\\.gradle\\.toolchains(\\..*)?'
            }
        }
        // Plain libraries on the plugin classpath (gson, commons-io, asm, ...).
        // Every artifact is pinned by gradle/verification-metadata.xml (SEC-40).
        mavenCentral()
    }
    plugins {
        id 'net.minecraftforge.gradle' version "${forgegradle_version}"
        id 'org.parchmentmc.librarian.forgegradle' version "${parchment_librarian_version}"
        id 'org.spongepowered.mixin' version "${mixingradle_version}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version "${foojay_resolver_version}"
}

rootProject.name = 'wildroots'

include ':genetics', ':mod'
