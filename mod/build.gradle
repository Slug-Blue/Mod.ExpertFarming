// :mod: the Forge mod (ForgeGradle 6). Based on Forge MDK 1.20.1-47.4.28.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    // Parchment parameter names on top of Mojang mappings (§18)
    id 'org.parchmentmc.librarian.forgegradle'
    // MixinGradle: only for the refmap (ADR-0014, §16)
    id 'org.spongepowered.mixin'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Java 17 toolchain: Mojang ships Java 17 to players in 1.18+ (§18).
// Locally foojay downloads the JDK if none is installed; CI installs
// Temurin 17 via actions/setup-java and disables auto-download (SEC-40).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"

    // Access transformer: entries only from docs/05-architecture.md §16,
    // checked against an allowlist in CI (SEC-45). Empty in phase 4.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Refmap remapping for dev runs (MixinGradle + ForgeGradle 6)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
