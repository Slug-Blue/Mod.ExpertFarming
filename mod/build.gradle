// :mod: the Forge mod (ForgeGradle 6). Based on Forge MDK 1.20.1-47.4.28.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    // Parchment parameter names on top of Mojang mappings (§18)
    id 'org.parchmentmc.librarian.forgegradle'
    // MixinGradle: only for the refmap (ADR-0014, §16)
    id 'org.spongepowered.mixin'
}

// :genetics must be configured first: its source set is used in the runs
// and in the jar below.
evaluationDependsOn(':genetics')

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Java 17 toolchain: Mojang ships Java 17 to players in 1.18+ (§18).
// Locally foojay downloads the JDK if none is installed; CI installs
// Temurin 17 via actions/setup-java and disables auto-download (SEC-40).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"

    // Access transformer: entries only from docs/05-architecture.md §16,
    // checked against an allowlist in CI (SEC-45). Empty in phase 4.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Refmap remapping for dev runs (MixinGradle + ForgeGradle 6)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // The engine is part of the wildroots mod in dev runs (ADR-0001)
                    source project(':genetics').sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':genetics')
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

// Expand mod metadata from gradle.properties into mods.toml and pack.mcmeta.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // Engine classes ship inside the mod jar, not as a nested jar (ADR-0001, SEC-42)
    from(project(':genetics').sourceSets.main.output)
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
